appId: com.infobae.scaffold
---
- launchApp:
    clearState: true
- assertVisible: 'My Infobae'
- waitForAnimationToEnd
- tapOn: 'My Infobae'
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${typeof RECORD !== 'undefined' && RECORD == 'true'}
    commands:
      - takeScreenshot: my-infobae
- runFlow:
    when:
      true: ${typeof RECORD === 'undefined' || RECORD != 'true'}
    commands:
      - assertScreenshot:
          path: ../baselines/my-infobae.png
          thresholdPercentage: 98

# Dark pass: the Menu with the Theme row, emulator in night mode, choice System.
appId: com.infobae.scaffold
tags:
  - dark
---
- launchApp:
    clearState: true
- runFlow: ../shared/pick-edition.yaml
- assertVisible: 'My Infobae'
- waitForAnimationToEnd
- tapOn: '^Menu$'
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${typeof RECORD !== 'undefined' && RECORD == 'true'}
    commands:
      - takeScreenshot: menu-dark
- runFlow:
    when:
      true: ${typeof RECORD === 'undefined' || RECORD != 'true'}
    commands:
      - assertScreenshot:
          path: ../baselines/menu-dark.png
          thresholdPercentage: 98

# Dark pass: runs only with the emulator in night mode (see config.yaml). The app follows the phone.
appId: com.infobae.scaffold
tags:
  - dark
---
- launchApp:
    clearState: true
- runFlow: ../shared/pick-edition.yaml
- assertVisible: 'My Infobae'
- waitForAnimationToEnd
- runFlow: ../shared/assert-tabs.yaml
- tapOn: 'My Infobae'
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${typeof RECORD !== 'undefined' && RECORD == 'true'}
    commands:
      - takeScreenshot: my-infobae-dark
- runFlow:
    when:
      true: ${typeof RECORD === 'undefined' || RECORD != 'true'}
    commands:
      - assertScreenshot:
          path: ../baselines/my-infobae-dark.png
          thresholdPercentage: 98

appId: com.infobae.scaffold
---
- launchApp:
    clearState: true
- assertVisible: 'My Infobae'
- waitForAnimationToEnd
- runFlow: ../shared/assert-tabs.yaml
- tapOn: 'Media'
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${typeof RECORD !== 'undefined' && RECORD == 'true'}
    commands:
      - takeScreenshot: media
- runFlow:
    when:
      true: ${typeof RECORD === 'undefined' || RECORD != 'true'}
    commands:
      - assertScreenshot:
          path: ../baselines/media.png
          thresholdPercentage: 98
